<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Get Google ID Token</title>
		<script src="https://accounts.google.com/gsi/client" async defer></script>
		<style>
			:root {
				color-scheme: light;
				font-family: Segoe UI, system-ui, sans-serif;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #f4f7fb;
				color: #12263a;
			}
			.card {
				width: min(720px, 92vw);
				background: #fff;
				border: 1px solid #d9e2ec;
				border-radius: 16px;
				padding: 28px;
				box-shadow: 0 10px 30px rgba(18, 38, 58, 0.08);
			}
			h1 {
				margin: 0 0 8px;
				font-size: 1.4rem;
			}
			p {
				margin: 0 0 18px;
				line-height: 1.5;
				color: #486581;
			}
			#buttonDiv {
				margin: 16px 0 20px;
			}
			textarea {
				width: 100%;
				min-height: 160px;
				resize: vertical;
				border: 1px solid #bcccdc;
				border-radius: 10px;
				padding: 12px;
				font-family: Consolas, monospace;
				font-size: 12px;
				box-sizing: border-box;
			}
			.actions {
				display: flex;
				gap: 10px;
				margin-top: 12px;
			}
			button {
				border: 0;
				border-radius: 999px;
				padding: 10px 16px;
				background: #243b53;
				color: #fff;
				cursor: pointer;
			}
			.note {
				margin-top: 16px;
				font-size: 0.9rem;
				background: #f0f4f8;
				padding: 12px;
				border-radius: 10px;
			}
			code {
				background: #e4ecf5;
				padding: 2px 6px;
				border-radius: 4px;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<h1>Google ID Token helper</h1>
			<p>
				Sign in with Google, copy the ID token, then paste it into Postman
				<code>POST /api/v1/auth/google</code> as <code>idToken</code>.
			</p>
			<div id="buttonDiv"></div>
			<label for="token">ID token</label>
			<textarea id="token" readonly placeholder="Token will appear here after Google sign-in"></textarea>
			<div class="actions">
				<button type="button" id="copyBtn">Copy token</button>
			</div>
			<div class="note">
				In Google Cloud Console → Credentials → your OAuth Client, add Authorized JavaScript
				origin: <code>http://localhost:5000</code>
			</div>
		</main>

		<script>
			const clientId = "__GOOGLE_CLIENT_ID__";

			function handleCredentialResponse(response) {
				const el = document.getElementById("token");
				el.value = response.credential;
			}

			window.onload = () => {
				if (!clientId || clientId.startsWith("__")) {
					document.getElementById("token").value =
						"GOOGLE_CLIENT_ID is missing in server .env";
					return;
				}

				google.accounts.id.initialize({
					client_id: clientId,
					callback: handleCredentialResponse,
				});

				google.accounts.id.renderButton(document.getElementById("buttonDiv"), {
					theme: "outline",
					size: "large",
					text: "signin_with",
					shape: "pill",
				});
			};

			document.getElementById("copyBtn").addEventListener("click", async () => {
				const value = document.getElementById("token").value;
				if (!value) return;
				await navigator.clipboard.writeText(value);
				document.getElementById("copyBtn").textContent = "Copied";
				setTimeout(() => {
					document.getElementById("copyBtn").textContent = "Copy token";
				}, 1200);
			});
		</script>
	</body>
</html>
